<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7f8">
  <title>MANDO - My projects</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23272727'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='800' text-anchor='middle' fill='%23fff' font-family='Arial'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/inter-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body class="projects-body">
  <main class="projects-page">
    <header class="projects-head">
      <h1>My projects</h1>
      <nav class="projects-nav" aria-label="Pages">
        <a href="/">Start page</a>
        <div data-theme-picker></div>
      </nav>
    </header>

    <p id="projects-count" class="projects-count" role="status" aria-live="polite"></p>
    <ul id="project-list" class="project-list"></ul>

    <div id="projects-empty" class="projects-empty" hidden>
      <p>No projects yet. Describe a business idea on the start page and build your first plan. It will appear here.</p>
      <a class="btn btn--dark" href="/">Start a new idea</a>
    </div>

    <div id="projects-signed-out" class="projects-empty" hidden>
      <p>Log in to see your projects.</p>
      <a class="btn btn--dark" href="/">Go to the start page</a>
    </div>

    <div id="projects-error" class="projects-empty" hidden>
      <p>Your projects could not be loaded. Reload the page to try again.</p>
    </div>
  </main>

  <script src="projects.js" defer></script>
</body>
</html>
