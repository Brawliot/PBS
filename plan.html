<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>MANDO - Your plan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23272727'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='800' text-anchor='middle' fill='%23fff' font-family='Arial'%3EM%3C/text%3E%3C/svg%3E">

  <div class="backdrop" aria-hidden="true"></div>

      <div class="giant__group">
        <span class="giant__letter giant__letter--gray">M</span>

        <span class="giant__letter giant__letter--gray">N</span>
        <span class="giant__letter">D</span>
        <span class="giant__letter">O</span>
      </div>
    </div>
  </div>

  <script src="tech-text.js" defer></script>
  <script src="loader.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="giant.js" defer></script>

</html>
