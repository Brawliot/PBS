<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANDO - Plan & Execute your Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Open+Sans:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="#" class="nav__login" data-auth="login">Log In</a>
      <a href="#" class="btn btn--dark" data-auth="register">Register</a>
    </nav>
  </header>

  <main class="hero">
    <h1 class="hero__title">MANDO</h1>
    <p class="hero__subtitle">Plan &amp; Execute your Business</p>


    <form class="search" action="#" novalidate>
      <div class="search__bar">
        <input class="search__input" type="text" placeholder="Value" aria-label="Describe tu negocio" required>
        <button class="search__submit" type="submit" aria-label="Enviar" disabled>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="filters">
        <div class="filter">
          <div class="filter__head"><label for="presupuesto">Presupuesto</label><span>$0-1.000.000</span></div>
          <input id="presupuesto" class="range" type="range" required min="0" max="1000000">
        </div>
        <div class="filter">
          <div class="filter__head"><label for="experiencia">Experiencia</label><span>años0-20+</span></div>
          <input id="experiencia" class="range" type="range" required min="0" max="20">
        </div>
        <div class="filter">
          <div class="filter__head"><label for="equipo">Tamaño equipo</label><span>$0-1.000.000</span></div>
          <input id="equipo" class="range" type="range" required min="0" max="1000000">
        </div>
        <div class="filter">
          <div class="filter__head"><label for="horas">Horas Disponibles</label><span>años0-20+</span></div>
          <input id="horas" class="range" type="range" required min="0" max="20">
        </div>
      </div>
    </form>
  </main>

  <div class="backdrop" aria-hidden="true"></div>

  <div class="giant" aria-hidden="true">
    <span class="giant__letter giant__letter--gray">M</span>
    <span class="giant__letter">A</span>
    <span class="giant__letter giant__letter--gray">N</span>
    <span class="giant__letter">D</span>
    <span class="giant__letter">O</span>
  </div>

  <div class="modal" id="auth-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <button class="modal__close" type="button" aria-label="Cerrar" data-close>&times;</button>
      <h2 class="modal__title" id="auth-title"></h2>

      <form class="auth" data-form="login" novalidate>
        <label class="auth__field">Email<input type="email" placeholder="Value" required></label>
        <label class="auth__field">Password<input type="password" placeholder="Value" required></label>
        <button class="auth__btn" type="submit">Sign In</button>
        <a href="#" class="auth__link">Forgot password?</a>
        <button class="auth__btn auth__btn--google" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>
      </form>

      <form class="auth" data-form="register" novalidate hidden>
        <label class="auth__field">Name<input type="text" placeholder="Value" required></label>
        <label class="auth__field">Email<input type="email" placeholder="Value" required></label>
        <label class="auth__field">Date of birth<input type="date" required></label>
        <label class="auth__field">Password<input type="password" placeholder="Value" required></label>
        <label class="auth__field">Repeat password<input type="password" placeholder="Value" required></label>
        <button class="auth__btn" type="submit">Register</button>
        <button class="auth__btn auth__btn--google" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Sign up with Google</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
